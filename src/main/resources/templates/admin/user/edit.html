<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/fragments/layout}">
<head>
  <title>회원 정보 수정</title>
  <link rel="stylesheet" th:href="@{/css/user/admin-user.css}">
</head>
<body>
<h2 layout:fragment="pageTitle">회원 상세 조회</h2>
<div layout:fragment="content" class="content-body">
  <div class="edit-page-flex">

    <section class="edit-form-section">
      <h3 style="margin-bottom: 20px;">회원 정보 수정</h3>
      <form th:action="@{/admin/users/edit}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{userNum}">

        <div class="form-group">
          <label>아이디 (변경불가)</label>
          <input type="text" th:field="*{userId}" readonly>
        </div>

        <div class="form-group">
          <label>이름</label>
          <input type="text" th:field="*{userName}">
        </div>

        <div class="form-group checkbox-group">
          <label>계정 활성화</label>
          <input type="checkbox" th:field="*{enabled}">
        </div>

        <div class="btn-area">
          <button type="submit" class="btn btn-primary">수정 완료</button>
          <a th:href="@{/admin/users}" class="btn btn-secondary">취소</a>
        </div>
      </form>
    </section>

    <section class="reservation-list-section">
      <h3>최근 대여 내역</h3>

      <div th:if="${not #lists.isEmpty(reservations)}">
        <table class="admin-table">
          <thead>
          <tr>
            <th>예약번호</th>
            <th>차량모델</th>
            <th>대여장소</th>
            <th>대여기간</th>
            <th>결제금액</th>
            <th>상태</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="res : ${reservations}">
            <td th:text="${res.reservationId}"></td>
            <td th:text="${res.carModel}"></td>
            <td th:text="${res.parkingName}"></td>
            <td>
              <span th:text="${#temporals.format(res.rentalDate, 'MM-dd HH:mm')}"></span> ~
              <br>
              <span th:text="${#temporals.format(res.returnDate, 'MM-dd HH:mm')}"></span>
            </td>
            <td th:text="${#numbers.formatInteger(res.totalPrice, 0, 'COMMA') + '원'}"></td>
            <td>
        <span th:class="${res.status == '완료' ? 'status-badge status-active' : 'status-badge status-stop'}"
              th:text="${res.status}"></span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <div th:unless="${not #lists.isEmpty(reservations)}" class="no-data">
        <p>최근 대여 내역이 존재하지 않습니다.</p>
      </div>
    </section>

  </div>
</div>
</body>
</html>
