<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/fragments/layout}">
<head>
    <title>에브리카 관리자 페이지 - 회원 관리</title>
    <link rel="stylesheet" th:href="@{/css/user/admin-user.css}">
</head>
<body>
<h2 layout:fragment="pageTitle">회원 관리</h2>
<div layout:fragment="content" class="content-body">
    <h2>회원 목록</h2>
    <div class="search-area" style="margin-bottom: 20px;">
        <form th:action="@{/admin/users}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="아이디 검색">
            <button type="submit" class="btn btn-edit">검색</button>
            <a th:href="@{/admin/users}" class="btn">초기화</a>
        </form>
    </div>
    <table class="admin-table">
        <thead>
        <tr>
            <th>번호</th>
            <th>아이디</th>
            <th>이름</th>
            <th>상태</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.userNum}"></td>
            <td th:text="${user.userId}"></td>
            <td th:text="${user.userName}"></td>
            <td>
                    <span th:class="${user.userStatus == 0 ? 'status-badge status-active' : 'status-badge status-stop'}"
                          th:text="${user.userStatus == 0 ? '정상' : '중지'}"></span>
            </td>
            <td>
                <a th:href="@{/admin/users/edit/{id}(id=${user.userNum})}" class="btn btn-edit">수정</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="pagination" style="margin-top: 20px; text-align: center;">
        <span th:each="i : ${#numbers.sequence(1, totalPages > 0 ? totalPages : 1)}">
            <a th:href="@{/admin/users(page=${i}, keyword=${keyword})}"
               th:text="${i}"
               th:style="${i == currentPage ? 'font-weight: bold; color: blue; margin: 0 5px;' : 'margin: 0 5px;'}">
            </a>
        </span>
    </div>
</div>
</body>
</html>
