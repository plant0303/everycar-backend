<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/fragments/layout}">
<head>
  <title>회원 관리</title>
  <link rel="stylesheet" th:href="@{/css/user/admin-user.css}">
  <link rel="stylesheet" th:href="@{/css/car/admin-car.css}">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<h2 layout:fragment="pageTitle">차량 관리</h2>
<div layout:fragment="content" class="content-body">
  <h2>차량 상세 정보 수정</h2>

  <div class="edit-page-flex">
    <section class="edit-form-section">
      <form th:action="@{/admin/cars/update}" th:object="${car}" id="editForm" method="post" onsubmit="return confirm('입력하신 정보로 차량 정보를 수정하시겠습니까?');">
        <input type="hidden" th:field="*{carId}">

        <div class="form-group">
          <label>차량 관리 번호 (ID)</label>
          <input type="text" th:field="*{carId}" disabled style="background:#eee;">
        </div>

        <div class="form-group">
          <label>모델 정보</label>
          <input type="text" th:value="|${car.modelBrand} ${car.modelName}|" readonly>
        </div>

        <div class="form-group">
          <label>차량 상태</label>
          <select th:field="*{carStatus}">
            <option value="0">대여 가능</option>
            <option value="1">대여 중</option>
            <option value="2">점검 중 (노출 정지)</option>
          </select>
        </div>

        <div class="form-group">
          <label>연식</label>
          <input type="number" th:field="*{carYear}" class="form-control">
        </div>

        <div class="form-group">
          <label>차량 등급</label>
          <select th:field="*{carGrade}" class="form-control">
            <option value="Premium">Premium</option>
            <option value="Standard">Standard</option>
          </select>
        </div>

        <div class="form-group">
          <label>배치 주차장 변경</label>
          <div class="search-select-wrapper">
            <input type="text" id="parkingSearchInput" class="form-control"
                   placeholder="주차장 이름을 입력하세요..."
                   th:value="${car.parkingName}" autocomplete="off">

            <input type="hidden" th:field="*{rentalStation}" id="rentalStationId">

            <div id="parkingResultList" class="search-dropdown-list">
              <div th:each="p : ${parkings}"
                   class="result-item"
                   th:data-id="${p.id}"
                   th:data-name="${p.name}"
                   th:text="${p.name}">
              </div>
              <div id="noResult" class="result-item" style="display: none; color: #999;">검색 결과가 없습니다.</div>
            </div>
          </div>
          <div class="btn-area">
            <button type="button" id="btnUpdate" class="btn btn-primary">정보 수정</button>
            <a th:href="@{/admin/cars}" class="btn btn-secondary">목록으로</a>
          </div>

          <script th:inline="javascript">
            (function() { // 즉시실행함수로 캡슐화
              const searchInput = document.getElementById('parkingSearchInput');
              const resultList = document.getElementById('parkingResultList');
              const noResult = document.getElementById('noResult');
              const items = resultList.getElementsByClassName('result-item');
              const hiddenIdInput = document.getElementById('rentalStationId');

              // 새로고침 방지
              searchInput.addEventListener('keydown', function(e) {
                  if (e.key === 'Enter') {
                      e.preventDefault(); // 엔터 시 폼 제출(새로고침) 방지
                      return false;
                  }
              });

              // 입력창 클릭 시 목록 보여주기
              searchInput.addEventListener('focus', function() {
                  resultList.style.display = 'block';
              });

              // 검색어 입력 시 실시간 필터링 로직
              searchInput.addEventListener('input', function() {
                  const keyword = this.value.toLowerCase().trim();
                  let visibleCount = 0;

                  Array.from(items).forEach(item => {
                      if (item.id === 'noResult') return;

                      const name = item.getAttribute('data-name').toLowerCase();
                      if (name.includes(keyword)) {
                          item.style.display = 'block'; // class 대신 직접 style 제어 (안전함)
                          visibleCount++;
                      } else {
                          item.style.display = 'none';
                      }
                  });

                  noResult.style.display = (visibleCount === 0 && keyword !== '') ? 'block' : 'none';
              });

              // 목록에서 주차장 선택 시 (이벤트 위임 방식)
              resultList.addEventListener('click', function(e) {
                  const target = e.target;
                  if (target.classList.contains('result-item') && target.id !== 'noResult') {
                      const id = target.getAttribute('data-id');
                      const name = target.getAttribute('data-name');

                      hiddenIdInput.value = id;
                      searchInput.value = name;
                      resultList.style.display = 'none';
                  }
              });

              // 외부 클릭 시 닫기
              document.addEventListener('click', function(e) {
                  if (!searchInput.contains(e.target) && !resultList.contains(e.target)) {
                      resultList.style.display = 'none';
                  }
              });
            })();

            document.getElementById('btnUpdate').addEventListener('click', function() {
              Swal.fire({
                  title: '수정하시겠습니까?',
                  text: "입력하신 정보가 시스템에 반영됩니다.",
                  icon: 'question',
                  showCancelButton: true,
                  confirmButtonColor: '#3498db',
                  cancelButtonColor: '#d33',
                  confirmButtonText: '수정',
                  cancelButtonText: '취소'
              }).then((result) => {
                  if (result.isConfirmed) {
                      // 사용자가 '수정'을 눌렀을 때만 폼 제출
                      document.getElementById('editForm').submit();
                  }
              });
          });
          </script>
        </div>
      </form>
    </section>

    <section class="reservation-list-section">
      <div class="recent-reservations" style="margin-bottom: 40px;">
        <h3>차량 이용 내역 (최근 순)</h3>
        <div th:if="${#lists.isEmpty(reservationList)}" class="info-box">
          이용 내역이 없습니다.
        </div>

        <table class="admin-table" style="font-size: 0.9em;" th:if="${!#lists.isEmpty(reservationList)}">
          <thead>
          <tr>
            <th>사용자</th>
            <th>대여일시</th>
            <th>상태</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="res : ${reservationList}">
            <td th:text="${res.userName}"></td>
            <td>
              <span th:text="${#strings.substring(res.rentalDate, 0, 16)}"></span>
            </td>
            <td>
                      <span th:text="${res.status}"
                            th:classappend="${res.status == '이용중'} ? 'text-danger fw-bold' : ''"></span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <h3>차량 정보 삭제</h3>
      <div style="padding: 20px; border: 1px solid #ffcdd2; background: #ffebee; border-radius: 5px;">
        <p style="color: #c62828; font-weight: bold;">위험구역</p>
        <p style="font-size: 0.9em; margin: 10px 0;">차량을 삭제하면 관련된 모든 예약 기록에 영향을 줄 수 있습니다.</p>

        <form th:action="@{/admin/cars/delete/{id}(id=${car.carId})}" method="post"
              onsubmit="return confirm('정말로 이 차량을 삭제하시겠습니까?');">
          <button type="submit" class="btn" style="background: #e53935; color: white; width: 100%;">차량 영구 삭제</button>
        </form>
      </div>
    </section>
  </div>
</div>
</body>
</html>
