<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>EveryCar Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>
<body>
<div class="login-container">
    <h2>EveryCar 관리자 로그인</h2>
    <form th:action="@{/admin/login}" method="post">
        <div class="error-msg" th:if="${errorMsg}">
            <span th:text="${errorMsg}"></span>
        </div>

        <div class="input-group">
            <label for="userId">관리자 아이디</label>
            <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="input-group">
            <label for="userPassword">비밀번호</label>
            <input type="password" id="userPassword" name="userPassword" placeholder="비밀번호를 입력하세요" required>
        </div>

        <button type="submit" class="btn-login">로그인</button>
    </form>
</div>
</body>
</html>
